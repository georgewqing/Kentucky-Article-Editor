<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: kentucky-file:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KENTUCKY</title>
    <!-- External script so CSP script-src 'self' allows theme bootstrap. -->
    <script src="./boot-theme.js"></script>
    <style>
      /* Shown before React/CSS bundles load — mirrors .welcome background. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--boot-bg, #141414);
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background:
          radial-gradient(ellipse at 20% 0%, var(--boot-accent-soft, rgba(136, 192, 208, 0.15)), transparent 45%),
          radial-gradient(ellipse at 90% 100%, var(--boot-elev, #242424), transparent 40%),
          var(--boot-bg, #141414);
        font-family: 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC', sans-serif;
        user-select: none;
        opacity: 1;
        transition: opacity 0.45s var(--ease-out, cubic-bezier(0.23, 1, 0.32, 1)), transform 0.45s var(--ease-out, cubic-bezier(0.23, 1, 0.32, 1));
      }
      #boot-splash.boot-splash-out {
        opacity: 0;
        transform: translateY(-4px);
        pointer-events: none;
      }
      #boot-splash .boot-brand {
        margin: 0;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--boot-fg, #f0f0f0);
      }
      #boot-splash .boot-bar {
        width: min(220px, 50vw);
        height: 3px;
        border-radius: 999px;
        background: var(--boot-bar-track, rgba(255, 255, 255, 0.08));
        overflow: hidden;
      }
      #boot-splash .boot-bar-fill {
        height: 100%;
        width: 40%;
        border-radius: inherit;
        background: var(--boot-accent, #88c0d0);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash {
          transition: none !important;
        }
        #boot-splash.boot-splash-out {
          transform: none !important;
        }
        #boot-splash .boot-bar-fill {
          animation: none !important;
          width: 70%;
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-busy="true" aria-label="Loading">
      <h1 class="boot-brand">KENTUCKY</h1>
      <div class="boot-bar" aria-hidden="true">
        <div class="boot-bar-fill"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
