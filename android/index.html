<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' blob: https: http:;"
    />
    <!-- Do not set maximum-scale/user-scalable=no: on Android WebView that breaks trackpad/list two-finger scroll. Page zoom is disabled in MainActivity WebSettings; canvas uses touch-action:none. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KENTUCKY</title>
    <!-- External script so CSP script-src 'self' allows theme bootstrap. -->
    <script src="/boot-theme.js"></script>
    <link rel="stylesheet" href="/boot-splash.css" />
  </head>
  <body>
    <div id="boot-splash" aria-busy="true" aria-label="Loading">
      <h1 class="boot-brand">KENTUCKY</h1>
      <div class="boot-bar" aria-hidden="true">
        <div class="boot-bar-fill"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
